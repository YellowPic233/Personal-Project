<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>活动管理 · 校园有约</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/styles.css?v=20261027">
  <script type="module" src="/static/js/admin.js?v=20261027"></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <header class="site-header"><div class="header-inner">
    <a class="brand" href="/" aria-label="校园有约首页"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M16 27V15M16 17C6 18 5 10 5 7c7-1 12 3 11 10Zm0 0C26 18 27 10 27 7c-7-1-12 3-11 10Z"/></svg></span>校园有约</a>
    <nav aria-label="主导航"><a href="/">活动广场</a><a href="/admin" aria-current="page">管理后台</a></nav>
  </div></header>
  <main id="main" class="container admin-main">
    <div class="admin-shell panel">
      <div class="admin-heading"><div><h1>活动管理</h1><p class="lead">发布活动、查看报名，让社团运营更轻松。</p><p class="time-note">本机管理 · 仅用于本地演示</p></div><button id="create-activity" class="button primary" disabled><span data-icon="plus" aria-hidden="true"></span>创建活动</button></div>
      <div id="category-error" class="inline-feedback" hidden></div>
      <section aria-label="活动统计"><div class="stats-grid" id="stats" aria-busy="true">
        <div class="stat-tile"><span class="stat-icon" data-icon="calendar" aria-hidden="true"></span><div><p>活动总数</p><strong id="stat-activities">—</strong></div></div>
        <div class="stat-tile"><span class="stat-icon" data-icon="users" aria-hidden="true"></span><div><p>报名人次</p><strong id="stat-registrations">—</strong></div></div>
        <div class="stat-tile"><span class="stat-icon" data-icon="user" aria-hidden="true"></span><div><p>参与学生<span class="stat-qualifier">（去重）</span></p><strong id="stat-students">—</strong></div></div>
      </div><div id="stats-error" class="inline-feedback" hidden></div></section>
      <section class="admin-list-section" aria-labelledby="list-title">
        <div class="section-heading"><h2 id="list-title">活动列表</h2><button id="refresh-dashboard" class="button quiet small"><span data-icon="refresh" aria-hidden="true"></span>刷新</button></div>
        <form id="admin-search" class="admin-filters" role="search">
          <div class="search-control"><span data-icon="search" aria-hidden="true"></span><label for="admin-q" class="sr-only">搜索活动或社团</label><input id="admin-q" name="q" type="search" maxlength="100" placeholder="搜索活动或社团" autocomplete="off"></div>
          <button class="button primary" type="submit">搜索</button>
          <label for="admin-category" class="sr-only">筛选活动分类</label><select id="admin-category" name="category" disabled><option value="">全部分类</option></select>
          <span id="admin-total" class="muted" aria-live="polite"></span>
        </form>
        <div id="admin-list" aria-busy="true"><div class="state-panel" role="status"><span class="spinner" aria-hidden="true"></span><h3>正在加载活动列表</h3></div></div>
        <nav id="admin-pagination" class="pagination align-end" aria-label="管理活动分页"></nav>
      </section>
    </div>
  </main>
  <footer class="site-footer container">校园有约 · 让每一份热爱都有回响。</footer>
  <dialog id="editor-dialog" class="dialog editor-dialog" aria-labelledby="editor-title">
    <div class="dialog-header"><div><h2 id="editor-title">创建活动</h2><p class="muted">时间均为北京时间（UTC+8），所有字段均为必填。</p></div><button class="icon-button" type="button" data-close="editor-dialog" aria-label="关闭活动编辑表单"><span data-icon="close" aria-hidden="true"></span></button></div>
    <div id="editor-loading" hidden></div>
    <form id="editor-form" novalidate>
      <div id="editor-error" class="form-error" role="alert" tabindex="-1" hidden></div>
      <fieldset id="editor-fields" class="form-fields form-grid">
        <legend class="sr-only">活动信息</legend>
        <div class="field span-2"><label for="edit-title">活动名称</label><input id="edit-title" name="title" maxlength="100" required placeholder="为活动起一个清晰的名称" aria-describedby="edit-title-error"><small id="edit-title-error" class="field-error" data-error-field="title" hidden></small></div>
        <div class="field"><label for="edit-club">主办社团</label><input id="edit-club" name="club_name" maxlength="100" required placeholder="请输入社团名称" aria-describedby="edit-club-error"><small id="edit-club-error" class="field-error" data-error-field="club_name" hidden></small></div>
        <div class="field"><label for="edit-category">活动分类</label><select id="edit-category" name="category" required aria-describedby="edit-category-error"><option value="">请选择分类</option></select><small id="edit-category-error" class="field-error" data-error-field="category" hidden></small></div>
        <div class="field span-2"><label for="edit-location">活动地点</label><input id="edit-location" name="location" maxlength="200" required placeholder="楼宇、教室或集合地点" aria-describedby="edit-location-error"><small id="edit-location-error" class="field-error" data-error-field="location" hidden></small></div>
        <div class="field"><label for="edit-start">开始时间</label><input id="edit-start" name="starts_at" type="datetime-local" step="0.001" required aria-describedby="edit-start-error"><small id="edit-start-error" class="field-error" data-error-field="starts_at" hidden></small></div>
        <div class="field"><label for="edit-end">结束时间</label><input id="edit-end" name="ends_at" type="datetime-local" step="0.001" required aria-describedby="edit-end-error"><small id="edit-end-error" class="field-error" data-error-field="ends_at" hidden></small></div>
        <div class="field"><label for="edit-deadline">报名截止</label><input id="edit-deadline" name="registration_deadline" type="datetime-local" step="0.001" required aria-describedby="edit-deadline-error"><small id="edit-deadline-error" class="field-error" data-error-field="registration_deadline" hidden></small></div>
        <div class="field"><label for="edit-capacity">活动名额</label><input id="edit-capacity" name="capacity" type="number" min="1" max="100000" step="1" required inputmode="numeric" placeholder="请输入可报名人数" aria-describedby="capacity-hint edit-capacity-error"><small id="capacity-hint" class="field-hint">不可少于当前已报名人数。</small><small id="edit-capacity-error" class="field-error" data-error-field="capacity" hidden></small></div>
        <div class="field span-2"><label for="edit-description">活动介绍</label><textarea id="edit-description" name="description" rows="4" maxlength="5000" required placeholder="介绍活动内容、参与要求或其他注意事项" aria-describedby="edit-description-error"></textarea><small id="edit-description-error" class="field-error" data-error-field="description" hidden></small></div>
      </fieldset>
      <div class="dialog-actions"><button type="button" class="button secondary" data-close="editor-dialog">取消</button><button id="editor-submit" type="submit" class="button primary">创建活动</button></div>
    </form>
  </dialog>
  <dialog id="roster-dialog" class="dialog roster-dialog" aria-labelledby="roster-title">
    <div class="dialog-header"><div><h2 id="roster-title">报名名单</h2><p id="roster-subtitle" class="muted"></p></div><button class="icon-button" type="button" data-close="roster-dialog" aria-label="关闭报名名单"><span data-icon="close" aria-hidden="true"></span></button></div>
    <div id="roster-content"></div><nav id="roster-pagination" class="pagination" aria-label="报名名单分页"></nav>
    <div class="dialog-actions"><button type="button" class="button secondary" data-close="roster-dialog">关闭</button></div>
  </dialog>
  <dialog id="delete-dialog" class="dialog confirm-dialog" aria-labelledby="delete-title">
    <div class="dialog-header"><h2 id="delete-title">删除活动？</h2><button class="icon-button" type="button" data-close="delete-dialog" aria-label="关闭删除确认"><span data-icon="close" aria-hidden="true"></span></button></div>
    <p id="delete-message"></p><p class="danger-text">活动及关联报名将永久删除，此操作无法撤销。</p>
    <div id="delete-error" class="form-error" role="alert" tabindex="-1" hidden></div>
    <div class="dialog-actions"><button class="button secondary" type="button" data-close="delete-dialog" autofocus>取消</button><button id="confirm-delete" class="button danger" type="button">确认删除</button></div>
  </dialog>
  <div id="toasts" class="toast-region" aria-live="polite"></div>
  <noscript><div class="noscript">请启用 JavaScript，以管理活动和查看报名。</div></noscript>
</body>
</html>
