<!doctype html>
<html lang="zh-CN">
<head>

  <title>活动广场 · 校园有约</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">

  <script type="module" src="/static/js/activities.js?v=20261027"></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <header class="site-header"><div class="header-inner">
    <a class="brand" href="/" aria-label="校园有约首页"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M16 27V15M16 17C6 18 5 10 5 7c7-1 12 3 11 10Zm0 0C26 18 27 10 27 7c-7-1-12 3-11 10Z"/></svg></span>校园有约</a>
    <nav aria-label="主导航"><a href="/" aria-current="page">活动广场</a><a href="/admin">管理后台</a></nav>
  </div></header>
  <main id="main" class="container home-main">
    <section class="discovery" aria-labelledby="page-title">
      <h1 id="page-title">让热爱，在校园发生。</h1>
      <p class="lead">发现感兴趣的活动，和同频的伙伴一起出发。</p>
      <form id="search-form" class="search-form" role="search">
        <label for="search" class="sr-only">搜索活动、社团或关键词</label>
        <span class="search-icon" data-icon="search" aria-hidden="true"></span>
        <input id="search" name="q" type="search" maxlength="100" placeholder="搜索活动、社团或关键词" autocomplete="off">
        <button type="submit" class="button primary">搜索</button>
      </form>
      <div id="category-filters" class="category-filters" role="group" aria-label="按活动分类筛选"><span class="muted">正在加载分类…</span></div>
      <div id="category-error" class="inline-feedback" hidden></div>
    </section>
    <section class="results-section" aria-labelledby="results-title">
      <div class="section-heading"><h2 id="results-title">探索活动</h2><p id="results-count" class="muted" aria-live="polite">正在获取活动…</p></div>
      <div id="activity-list" aria-busy="true"><div class="state-panel" role="status"><span class="spinner" aria-hidden="true"></span><h3>正在加载活动</h3><p>精彩的校园生活，马上呈现。</p></div></div>
      <nav id="pagination" class="pagination" aria-label="活动分页"></nav>
    </section>
  </main>
  <footer class="site-footer container">校园有约 · 让每一份热爱都有回响。</footer>
  <div id="toasts" class="toast-region" aria-live="polite"></div>
  <noscript><div class="noscript">请启用 JavaScript，以加载活动和使用报名功能。</div></noscript>
